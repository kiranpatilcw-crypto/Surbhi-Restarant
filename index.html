        :root {
            --gold: #FFD700;
            --gold-dark: #ccac00;
            --bg-main: #0a0a0a;
            --bg-card: #141414;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: #e5e5e5;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: 100px; /* Space for floating cart */
        }

        h1, h2, h3, .font-serif {
            font-family: 'Playfair Display', serif;
        }

        /* Hide Scrollbar for Horizontal Nav */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        .gold-text { color: var(--gold); }
        .gold-bg { background-color: var(--gold); color: #000; }
        .gold-border { border-color: var(--gold); }

        .btn-add {
            background-color: transparent;
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: var(--gold);
            padding: 6px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.875rem;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        .btn-add:active {
            background-color: var(--gold);
            color: #000;
        }

        .qty-control {
            display: flex;
            align-items: center;
            background: #1a1a1a;
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 6px;
            overflow: hidden;
        }
        .qty-btn {
            color: var(--gold);
            padding: 6px 12px;
            font-size: 1.1rem;
            background: transparent;
            border: none;
            cursor: pointer;
        }
        .qty-btn:active { background: rgba(255, 215, 0, 0.1); }
        .qty-val {
            color: #fff;
            font-weight: bold;
            padding: 0 8px;
            min-width: 28px;
            text-align: center;
        }

        /* Toast Animation */
        #toast {
            visibility: hidden;
            opacity: 0;
            transition: visibility 0s, opacity 0.3s linear;
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
        }
    </style>

        // SVG Icons
        const vegIcon = `<div class="w-4 h-4 border border-green-500 p-[2px] flex items-center justify-center rounded-sm"><div class="w-2 h-2 rounded-full bg-green-500"></div></div>`;
        const nonVegIcon = `<div class="w-4 h-4 border border-red-500 p-[2px] flex items-center justify-center rounded-sm"><div class="w-2 h-2 rounded-full bg-red-500"></div></div>`;

        // Initialization
        document.addEventListener('DOMContentLoaded', () => {
            renderNav();
            renderMenu();
            
            // Remove validation message on typing
            ['cust-name', 'cust-mobile', 'cust-table'].forEach(id => {
                document.getElementById(id).addEventListener('input', () => {
                    document.getElementById('validation-msg').classList.add('hidden');
                });
            });
        });

        function renderNav() {
            const nav = document.getElementById('category-nav');
            let html = '';
            menuData.forEach((cat, index) => {
                const id = cat.category.replace(/\s+/g, '-');
                const isFirst = index === 0;
                html += `
                    <a href="#${id}" 
                       onclick="setActiveNav(this)"
                       class="nav-btn whitespace-nowrap flex-shrink-0 px-5 py-2 rounded-full text-sm font-medium transition-all snap-start border border-gray-700 text-gray-400 hover:border-yellow-500 hover:text-yellow-500 ${isFirst ? 'gold-bg border-yellow-500 active-nav' : ''}">
                        ${cat.category}
                    </a>
                `;
            });
            nav.innerHTML = html;
        }

        function setActiveNav(element) {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('gold-bg', 'border-yellow-500', 'active-nav');
                btn.classList.add('border-gray-700', 'text-gray-400');
                btn.style.color = ""; // reset inline style
            });
            element.classList.remove('border-gray-700', 'text-gray-400');
            element.classList.add('gold-bg', 'border-yellow-500', 'active-nav');
            // Remove text color class to let gold-bg take over black text
            element.style.color = "#000"; 
        }

        function renderMenu() {
            const container = document.getElementById('menu-container');
            let html = '';
            menuData.forEach(cat => {
                const sectionId = cat.category.replace(/\s+/g, '-');
                html += `
                    <div id="${sectionId}" class="scroll-mt-32 mb-10 pt-4">
                        <div class="flex items-center gap-4 mb-6">
                            <div class="h-px bg-gradient-to-r from-transparent via-yellow-500/50 to-transparent flex-1"></div>
                            <h2 class="text-2xl font-serif gold-text tracking-wide text-center whitespace-nowrap">${cat.category}</h2>
                            <div class="h-px bg-gradient-to-r from-transparent via-yellow-500/50 to-transparent flex-1"></div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${cat.items.map(item => generateItemCard(item)).join('')}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function generateItemCard(item) {
            const qty = cart[item.id] || 0;
            const icon = item.type === 'veg' ? vegIcon : nonVegIcon;
            
            let btnHtml = '';
            if (qty > 0) {
                btnHtml = `
                    <div class="qty-control shadow-inner">
                        <button onclick="updateQty('${item.id}', -1)" class="qty-btn"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
                        <span class="qty-val">${qty}</span>
                        <button onclick="updateQty('${item.id}', 1)" class="qty-btn"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
                    </div>
                `;
            } else {
                btnHtml = `<button onclick="updateQty('${item.id}', 1)" class="btn-add hover:bg-yellow-500 hover:text-black">ADD</button>`;
            }

            return `
                <div class="bg-[#141414] border border-gray-800 hover:border-yellow-500/40 rounded-xl p-4 flex justify-between items-center gap-4 transition-colors duration-300">
                    <div class="flex-1">
                        <div class="flex items-start gap-2.5 mb-1">
                            <div class="mt-1 flex-shrink-0">${icon}</div>
                            <h3 class="font-medium text-gray-100 text-[16px] leading-tight">${item.name}</h3>
                        </div>
                        <p class="gold-text font-semibold text-lg ml-7 border-l-2 border-yellow-500/20 pl-2">₹${item.price}</p>
                    </div>
                    <div class="flex-shrink-0 min-w-[90px] flex justify-end" id="control-${item.id}">
                        ${btnHtml}
                    </div>
                </div>
            `;
        }

        function updateQty(itemId, delta) {
            const currentQty = cart[itemId] || 0;
            const newQty = Math.max(0, currentQty + delta);
            
            if (newQty === 0) {
                delete cart[itemId];
            } else {
                cart[itemId] = newQty;
            }

            // Re-render specific item button area
            const controlDiv = document.getElementById(`control-${itemId}`);
            if (controlDiv) {
                const item = allItemsMap[itemId];
                if (newQty > 0) {
                    controlDiv.innerHTML = `
                        <div class="qty-control shadow-inner">
                            <button onclick="updateQty('${itemId}', -1)" class="qty-btn"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
                            <span class="qty-val">${newQty}</span>
                            <button onclick="updateQty('${itemId}', 1)" class="qty-btn"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
                        </div>
                    `;
                } else {
                    controlDiv.innerHTML = `<button onclick="updateQty('${itemId}', 1)" class="btn-add hover:bg-yellow-500 hover:text-black">ADD</button>`;
                }
            }

            updateCartUI();
            
            // If modal is open, re-render modal content
            if (!document.getElementById('cart-modal').classList.contains('hidden')) {
                renderModalCartItems();
                if(Object.keys(cart).length === 0) closeCartModal();
            }
        }

        function updateCartUI() {
            let totalItems = 0;
            let totalPrice = 0;

            for (const [id, qty] of Object.entries(cart)) {
                totalItems += qty;
                totalPrice += allItemsMap[id].price * qty;
            }

            document.getElementById('cart-item-count').innerText = totalItems;
            document.getElementById('cart-total-price').innerText = totalPrice;
            document.getElementById('modal-total-price').innerText = totalPrice;

            const floatCart = document.getElementById('floating-cart');
            if (totalItems > 0) {
                floatCart.classList.remove('translate-y-full');
            } else {
                floatCart.classList.add('translate-y-full');
            }
        }

        function openCartModal() {
            renderModalCartItems();
            document.getElementById('cart-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden'; // Prevent background scroll
        }

        function closeCartModal() {
            document.getElementById('cart-modal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        function renderModalCartItems() {
            const container = document.getElementById('cart-items-container');
            let html = '';
            
            for (const [id, qty] of Object.entries(cart)) {
                const item = allItemsMap[id];
                const icon = item.type === 'veg' ? vegIcon : nonVegIcon;
                html += `
                    <div class="flex justify-between items-center gap-3 bg-[#1a1a1a] p-3 rounded-xl border border-gray-800/50">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1">
                                ${icon}
                                <h4 class="font-medium text-gray-200 text-sm leading-tight">${item.name}</h4>
                            </div>
                            <p class="text-xs gold-text ml-6">₹${item.price}</p>
                        </div>
                        
                        <div class="flex items-center bg-[#0a0a0a] rounded-md overflow-hidden border border-gray-700">
                            <button onclick="updateQty('${id}', -1)" class="p-1.5 text-gray-400 hover:text-yellow-500 hover:bg-gray-800"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
                            <span class="w-6 text-center text-white text-sm font-bold">${qty}</span>
                            <button onclick="updateQty('${id}', 1)" class="p-1.5 text-gray-400 hover:text-yellow-500 hover:bg-gray-800"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
                        </div>
                        <div class="w-14 text-right font-bold text-white text-sm">
                            ₹${item.price * qty}
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        function showToast() {
            const toast = document.getElementById("toast");
            toast.className = "fixed top-24 left-1/2 transform -translate-x-1/2 bg-[#1a1a1a] border border-red-500 text-white px-6 py-3 rounded-full shadow-2xl z-50 flex items-center gap-2 w-max max-w-[90vw] show";
            setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3500);
        }

        function checkout() {
            const name = document.getElementById('cust-name').value.trim();
            const mobile = document.getElementById('cust-mobile').value.trim();
            const table = document.getElementById('cust-table').value.trim();

            if (!name || !mobile || !table) {
                closeCartModal();
                
                // Show inline validation and toast
                const valMsg = document.getElementById('validation-msg');
                valMsg.classList.remove('hidden');
                
                showToast();

                // Scroll to top with offset
                const formSection = document.getElementById('customer-form-section');
                const yOffset = -20; 
                const y = formSection.getBoundingClientRect().top + window.pageYOffset + yOffset;
                window.scrollTo({top: y, behavior: 'smooth'});
                
                // Highlight fields
                if(!name) document.getElementById('cust-name').classList.add('border-red-500');
                if(!mobile) document.getElementById('cust-mobile').classList.add('border-red-500');
                if(!table) document.getElementById('cust-table').classList.add('border-red-500');
                
                setTimeout(() => {
                    document.getElementById('cust-name').classList.remove('border-red-500');
                    document.getElementById('cust-mobile').classList.remove('border-red-500');
                    document.getElementById('cust-table').classList.remove('border-red-500');
                }, 3000);

                return;
            }

            let totalPrice = 0;
            let orderDetails = "";

            for (const [id, qty] of Object.entries(cart)) {
                const item = allItemsMap[id];
                const itemTotal = item.price * qty;
                totalPrice += itemTotal;
                orderDetails += `${item.name} x ${qty} - Rs ${item.price}%0A`;
            }

            const message = `New Order!%0A%0ACustomer: ${name}%0AMobile: ${mobile}%0ATable No: ${table}%0A%0AOrder Details:%0A${orderDetails}%0ATotal Amount: Rs ${totalPrice}`;
            
            const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;
            window.open(whatsappUrl, '_blank');
        }

        // Active Nav spy on scroll
        window.addEventListener('scroll', () => {
            let current = '';
            const sections = document.querySelectorAll('main > div');
            
            sections.forEach(section => {
                const sectionTop = section.offsetTop;
                if (scrollY >= sectionTop - 150) {
                    current = section.getAttribute('id');
                }
            });

            if (current) {
                const navLinks = document.querySelectorAll('.nav-btn');
                navLinks.forEach(a => {
                    const href = a.getAttribute('href').substring(1);
                    if (href === current) {
                        setActiveNav(a);
                        // Optional: smoothly scroll the nav bar itself so active item is visible
                        a.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
                    }
                });
            }
        });
    </script>
</body>
</html>
